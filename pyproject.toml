[project]
name = "retinal-vessels"
version = "0.0.0"
description = "U-Net retinal vessel segmentation on DRIVE, with cross-validation, external validation, and uncertainty maps. Learning project, not for clinical use."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Melamed" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "tensorflow>=2.21,<2.22",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.25",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "mutmut>=3.2",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "sqlfluff>=3.2",
    "pre-commit>=4.0",
    "nbstripout>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retinal_vessels"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The agent hook scripts are protected, stdlib-only tooling kept outside the
# package, and are checked by their own review rather than this config.
extend-exclude = ["scripts/agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]

[[tool.mypy.overrides]]
module = ["tensorflow", "tensorflow.*", "skimage", "skimage.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=retinal_vessels --cov-report=term-missing"
markers = [
    "slow: takes more than a few seconds; skipped by make agent-check",
    "smoke: end-to-end run on synthetic data; run by make smoke",
]

[tool.coverage.run]
source = ["retinal_vessels"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
