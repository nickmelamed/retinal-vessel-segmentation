[project]
name = "retinal-vessels"
version = "0.0.0"
description = "U-Net retinal vessel segmentation on DRIVE, with cross-validation, external validation, and uncertainty maps. Learning project, not for clinical use."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Melamed" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "tensorflow>=2.21,<2.22",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.25",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "mutmut>=3.2",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "sqlfluff>=3.2",
    "pre-commit>=4.0",
    "nbstripout>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retinal_vessels"]

# Installed copies need the schema and queries, which live outside the package in sql/.
[tool.hatch.build.targets.wheel.force-include]
"sql/schema.sql" = "retinal_vessels/schema.sql"
"sql/queries" = "retinal_vessels/queries"

[tool.ruff]
line-length = 100
target-version = "py313"
# Stdlib-only hook scripts outside the package. Excluded so ruff format never
# rewrites them (D-008).
extend-exclude = ["scripts/agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]

[[tool.mypy.overrides]]
module = ["tensorflow", "tensorflow.*", "skimage", "skimage.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=retinal_vessels --cov-report=term-missing"
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "slow: takes more than a few seconds, skipped by make agent-check",
    "smoke: end-to-end run on synthetic data, run by make smoke",
]

[tool.coverage.run]
source = ["retinal_vessels"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

# Mutation testing of the fold code (make mutate). Only the tests that
# exercise data.py run, since the full suite would add minutes per mutant.
[tool.mutmut]
source_paths = ["src/retinal_vessels/data.py"]
also_copy = ["src/", "tests/", "sql/", "configs/"]
pytest_add_cli_args = ["--no-cov", "-p", "no:warnings"]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_data.py",
    "tests/unit/test_db_writes.py",
    "tests/unit/test_leakage_audit.py",
]
