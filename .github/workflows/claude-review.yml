name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md for the project rules and
            docs/SPEC.md for the design, focusing on the sections the changed
            files implement.

            Look for, in order of importance:
            1. Breaks of the non-negotiable rules in CLAUDE.md, especially
               held-out or external data informing any choice, numbers in docs
               that do not come from results/, clinical framing, and data or
               images committed to git.
            2. Changes to the evaluation design in SPEC section 5, or to files
               listed in .claude/protected-paths, that the description does
               not explain.
            3. Correctness bugs, and tests that were weakened or do not test
               what they claim.
            4. Gaps against the SPEC requirements for this phase.

            Leave inline comments on specific lines, and one short summary
            comment. Say plainly if you found nothing that needs changing.
            Do not comment on style that ruff or the pre-commit hooks already
            enforce.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
