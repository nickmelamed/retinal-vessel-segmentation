name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Python comes from .python-version. The cache holds TensorFlow's wheels.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Smoke run on synthetic data
        run: make smoke

      - name: Check requirements.txt matches uv.lock
        run: make lock-check

      # The R report render check is added in phase 8 (D-005).
