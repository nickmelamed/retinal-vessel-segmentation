# Baseline variant (SPEC section 7). Each setting is required, see
# src/retinal_vessels/config.py.
variant: baseline
# Patch sampling and training. The folds have their own seed below.
seed: 20260926

folds:
  seed: 20260926
  n_folds: 5
  n_val: 2

preprocess:
  green_channel: true
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  scale_unit: true
  standardize_in_fov: true

patches:
  size: 64
  per_epoch: 4000
  batch_size: 32
  flip_probability: 0.5
  rot90: true
  brightness_delta: 0.1
  contrast_range: [0.9, 1.1]

model:
  depth: 4
  base_filters: 32
  dropout: 0.2
  batch_norm: true

loss:
  name: bce_dice
  smooth: 1.0

training:
  max_epochs: 100
  patience: 10
  learning_rate: 0.001
  deterministic_ops: true

inference:
  window: 128
  stride: 64
  batch_size: 16

threshold:
  divisions: 100

evaluation:
  reliability_bins: 10
  thin_quantile: 0.5
