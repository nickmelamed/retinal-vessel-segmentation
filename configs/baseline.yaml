# Baseline variant (SPEC section 7). Each setting is required, see
# src/retinal_vessels/config.py.
variant: baseline
seed: 20260926

folds:
  n_folds: 5
  n_val: 2

preprocess:
  green_channel: true
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]
  scale_unit: true
  standardize_in_fov: true

patches:
  size: 64
  per_epoch: 4000
  batch_size: 32
  flip_probability: 0.5
  rot90: true
  brightness_delta: 0.1
  contrast_range: [0.9, 1.1]
